<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 検索に出さない。参照元を外部へ送らない -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>外部通報窓口 学校連携</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  /* 画面いっぱいの iframe。いちばん下に開けないときの案内の帯（index.html と同じ形） */
  body.embed { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  #app { flex: 1 1 auto; width: 100%; min-height: 0; border: 0; display: block; }
  #help { flex: 0 0 auto; font-family: system-ui, sans-serif; font-size: 12px; line-height: 1.5; color: #57606a; background: #f6f8fa; border-top: 1px solid #d0d7de; padding: 4px 12px calc(4px + env(safe-area-inset-bottom)); }
  #help a { color: #0969da; }
  .msg { font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.7; color: #1f2328; padding: 24px 16px; max-width: 640px; margin: 0 auto; }
</style>
<!-- 学校担当アプリの URL（デプロイの ID が変わったら config.js だけを直す） -->
<script src="config.js"></script>
</head>
<body>
<noscript><p class="msg">このページを使うには、JavaScript をオンにしてください。</p></noscript>
<script>
/*
 * 学校担当アプリの入口ページ（2026-11-26）。依頼・期限のメールに書く URL（SCHOOL_URL）はこのページ。
 * 学校担当アプリ（Google Apps Script の Web アプリ）を画面いっぱいの iframe で開く。
 * 埋め込んで開くと、Google の「このアプリケーションは Google Apps Script のユーザーによって作成されたものです」が出ない。
 * このページには依頼の中身を置かず、何も記録しない。パラメータは受け取らない。
 */
(function () {
  var GAS_URL = /^https:\/\/script\.google\.com\/(?:a\/macros\/[a-z0-9.-]+\/|macros\/)s\/[A-Za-z0-9_-]+\/exec$/;
  var base = String(window.SCHOOL_APP || '');
  if (!GAS_URL.test(base)) {
    var p = document.createElement('p');
    p.className = 'msg';
    p.textContent = 'ページを開けませんでした。外部通報窓口からのメールにあるリンクを、もう一度開いてください。';
    document.body.appendChild(p);
    return;
  }
  var f = document.createElement('iframe');
  f.id = 'app';
  f.src = base;
  f.title = '外部通報窓口 学校連携';
  f.setAttribute('referrerpolicy', 'no-referrer');
  document.body.className = 'embed';
  document.body.appendChild(f);

  // 開けないとき（ブラウザの設定で埋め込みが止まる、複数の Google アカウントでログインしていて枠の中に
  // 「ファイルを開くことができません」が出るなど）は、学校担当アプリを直接開く
  var help = document.createElement('div');
  help.id = 'help';
  help.appendChild(document.createTextNode('うまく表示されないとき（複数の Google アカウントでログインしているときなど）は、'));
  var a = document.createElement('a');
  a.href = base;
  a.target = '_top';
  a.rel = 'noreferrer';
  a.textContent = 'こちら（直接開く）';
  help.appendChild(a);
  help.appendChild(document.createTextNode('。'));
  document.body.appendChild(help);
})();
</script>
</body>
</html>
